name: Feature request
description: Propose a concrete change (ideas without a concrete shape belong in Discussions)
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would the YAML / CLI / API look like? Sketch it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This would change the metadata format or public SDK API (breaking for pinned apps)
